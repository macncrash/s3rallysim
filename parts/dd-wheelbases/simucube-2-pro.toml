# Simucube 2 Pro direct-drive wheelbase, 25 Nm
id = "simucube-2-pro"
category = "dd-wheelbases"
maker = "Simucube"
country = "FI"
model = "Simucube 2 Pro"
notes = "Dimensions are printed as 130 x 130 x 270 mm including the Simucube Quick Release (SQR); length_mm = 270 and diameter_or_width_mm = 130 taken from that. Front flange: 4 x M8 threaded holes on a 145 mm bolt circle, 110 mm flange centering hole; Simucube's mounting guide says Sport and Pro mount with 30 mm M8 x 1.25 bolts and M8 flat washers into the threaded front-flange holes (no locking nuts). Quick release: the base comes with the pin for the Simucube Quick Release; the SQR side parts are sold separately (quick_release = true means the base takes the maker's QR). The page does not say whether the 11.1 kg weight includes the SQR. Shaft diameter not published."

