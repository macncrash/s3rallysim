notes = "Full order code depends on the motor adaptation and is generated in Neugart's Tec Data Finder / NCP; this card is for WPLN142 2-stage at i = 50 (offered ratios near 50: 40, 50, 64). Page numbers are PDF indexes of the chapter (PDF 3 = catalog p. 142, 4 = 143, 5 = 144, 6 = dimensions). nominal_output_torque_nm is the continuous torque T2D = 315 N·m; Neugart's cyclic torque T2Z at i = 50 is 375 N·m. max_accel_output_torque_nm is the maximum torque T2max = 600 N·m. emergency_stop_torque_nm T2Stop = 1200 N·m, permitted 1000 times. nominal_input_speed_rpm is the continuous input speed n1D = 1350 rpm at i = 50 (thermal; 3000 rpm continuous is above this), max mechanical input speed 9500 rpm (2-stage). Radial force 12500 N (2-stage); the chapter does not state the load point on the shaft (the catalog says technical explanations start on p. 201, not in this chapter). Axial 12000 N, max tilting moment 1420 N·m (2-stage). Backlash: standard < 5 arcmin, reduced (R) < 3 arcmin on 2-stage. Efficiency 94% (2-stage). Mass 23.7 - 24.3 kg and torsional stiffness 31.5 - 42.5 N·m/arcmin are ranges over ratios (exact values in Tec Data Finder), so mass_kg and torsional_stiffness_nm_per_arcmin are left out. Input: 2-stage reference clamping diameter 24 mm (F), also 35 mm (G); a 24 mm servo shaft (AKM2G-5x, AM8052, SGM7A-20) uses the F clamp, Delta 22 mm / Siemens 19 mm would need a bushing or other clamp - motor adapter flange per motor from Tec Data Finder. Output: 142 mm square flange, 130 g7 centering, 4 x 11 holes on 165 PCD, shaft 40 k6 x 110 (keyed A 12x8x65 or smooth or DIN 5480 splined), total length 342.5 mm (2-stage). Counterdirectional rotation."

