# WITTENSTEIN alpha SPK+ 140 hypoid right-angle gearbox with planetary output stage, 2-stage, i = 50
id = "wittenstein-spk-140-mf2-50"
category = "gearboxes"
maker = "WITTENSTEIN alpha"
country = "DE"
model = "SPK+ 140 S-MF2-50-1H1-1K01"
notes = "Order code assembled from the hypoid/bevel ordering key (PDF p. 348, printed 350): size 140, S = standard, M = motor-mounted, F = standard model, 2 stages, i = 50, output 1 = shaft with key, clamping hub H = 28 mm (standard; K = 38 mm also listed), backlash 1 = standard, generation 1, K = coupling, 0 input stages, 1 output stage - confirm with WITTENSTEIN / cymex before ordering. Page numbers are PDF indexes (PDF 154 = printed 156, PDF 155 = printed 157). nominal_output_torque_nm is T2N (at n1N) = 360 N·m; max_accel_output_torque_nm is T2B = 625 N·m (max. 1000 cycles per hour) - below the 800 N·m target, the smaller sibling of the SPK+ 180 card; T2alpha = 625 N·m; emergency_stop_torque_nm T2Not = 1250 N·m (1000 times). Torques are for a smooth shaft and standard hub; a keyed shaft has reduced performance (product page) - check in cymex. nominal_input_speed_rpm is permitted average input speed n1N = 2300 rpm (at T2N, 20 C ambient). Lateral force F2QMax 9600 N and axial F2AMax 9870 N refer to the center of the output shaft or flange; max tilting moment 1000 N·m. Backlash standard <= 4, reduced <= 2 arcmin. Efficiency 94%. Mass 20 kg incl. standard adapter plate. Input inertia 2.79 kg·cm2 (i = 50, 28 mm hub). Input: motor shafts up to 28 (H) / 38 (K) mm; a 24 mm servo shaft uses a bushing (min. 1 mm wall); adapter plate depends on the motor. Output: 141 mm square flange, 130 g7 pilot, 4 x 11 holes on 165 PCD, shaft 40 k6 x 82 (key 12 mm), overall length about 323.2 mm (drawing). Rotation: input and output opposite."

