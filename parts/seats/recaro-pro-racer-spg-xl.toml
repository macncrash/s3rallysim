model = "Pro Racer SPG XL, velour black 071.38.0630-01"
notes = "Card is for the XL size, chosen for a 95th-percentile driver: Recaro says the XL 'is 1.4 inches wider and 2.0 inches higher than the standard size'. FIA homologation CS.135.05 (XL; the standard SPG is CS.305.14). Recaro's overview table ticks GT, touring and rally use. Mounting hardware sold separately: steel side mount 360942, flexible (fore-aft) adaptor 7206293NA for the XL. mass_kg 10 excludes mounting hardware. Recaro's dimension drawing is for the standard SPG only (575 mm shoulder width, 455 mm and 350 mm internal widths, 402 / 455 mm base, 860 mm height, 820 mm length); no XL drawing, so internal_width_mm and overall_width_mm are left out. Recaro's site lists the seat as Pro Racer SPG XL; check current availability."

