# Sparco Circuit II QRT: fibreglass (QRT) side-mount competition bucket seat, large size of the Circuit QRT family
id = "sparco-circuit-ii-qrt"
category = "seats"
maker = "Sparco"
country = "IT"
model = "Circuit II QRT (008011RNR)"
notes = "Card is for the Circuit II (the large size; Sparco: 'Available in 2 sizes (Circuit II size L)'); the standard size is the Circuit QRT. Sparco gives shell 7.500 g, seat 8.700 g; mass_kg is the complete seat. Side fixing 4 x M8, 290 mm fore-aft spacing, 420.5 mm across the fixing points; external base width 487 mm, back shell width 560 mm, shoulder-strap slot height 700 mm (Sparco dimension drawing). Side brackets are not included and are not named on the page. Sparco publishes no internal hip/shoulder width, so internal_width_mm is left out: check against the 420 mm requirement on a sample. HANS / head-and-neck compatibility is not stated on the Sparco page. FIA 8855-1999 (not 8855-2021); homologation number from the Sparco product page. Sparco's product data lists country of manufacture as Tunisia."

