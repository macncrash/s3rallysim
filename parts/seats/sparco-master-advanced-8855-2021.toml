# Sparco Master Advanced: FIA 8855-2021 competition seat with steel side brackets, for rally and racing
id = "sparco-master-advanced-8855-2021"
category = "seats"
maker = "Sparco"
country = "IT"
model = "Master Advanced 8855-2021 (BRR0015B0)"
notes = "One size; Sparco: 'Suitable for drivers between 1.75 and 1.95 m tall'. Homologated only with floor seat brackets 004926 (steel); the FIA form also lists alternative brackets BAA0385B0 (DOMEX 700 MC, driver and co-driver LH/RH). Brackets are sold separately (Sparco also lists 'Master side mounting frames' 004919). Mass: Sparco gives 'Weight of frame only: 9.5 kg, Standard saddle weight: 11.7 kg, Weight with light saddle (on demand): 11 kg' (machine-translated wording; 'saddle' = upholstered seat); mass_kg is the standard 11.7 kg. The FIA presentation form states seat weight 10 kg. Side fixing 4 x M12 at 290 mm fore-aft; 401 mm front / 390 mm rear across the fixing points; head-restraint outer width 457 mm; strap-slot height 672 mm (Sparco drawing, titled 'MASTER'). No internal hip/shoulder width published: internal_width_mm left out. Shell material not stated beyond 'backrest with carbon fibre front skin'. HANS/FHR compatibility not stated on the Sparco page (8855-2021 seats are designed for FHR use, but the source does not say so)."

