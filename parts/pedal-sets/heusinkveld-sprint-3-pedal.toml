notes = "Card is for the 3-pedal set (clutch, throttle, brake) as sold. brake_max_force_kg is the maker's 'Max actual braking force' (65 kg); the brake load cell is rated 120 kg (load_cell_rating_kg). Maker prints 'Dimensions: 363x222x90mm' without axis labels or saying whether it is the set or one pedal, so length/width/height are left out. Controller integrated in the brake pedal. Mounting 'On a full frame rig (you can use the optional Sprint Baseplate)'; each pedal has four mounting slots for fore-aft adjustment. Maker FAQ: cannot be installed on a floor without further support. No maker document found stating the pivot location or lateral spacing adjustment, so floor_hinged and adjustable_pedal_spacing are left out (the pedals are individual units like the Ultimate+, which suggests both, but unconfirmed)."

