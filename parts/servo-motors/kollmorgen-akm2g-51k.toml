sg = { title = "Kollmorgen AKM2G Servo Motor Selection Guide, KM_SG_000315_RevE_EN", url = "https://www.ahs-antriebstechnik.de/images/PDFDateien/Servomotoren/2023/AKM2G-Selectionguide-E.pdf" }

