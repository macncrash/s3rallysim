notes = """Catalogue page A15-268 'BLK (Rolled Ball Screw)', no preload (2-page PDF excerpt, page 1). \
Ball center-to-center diameter dp 20.75 mm, thread minor diameter dc 17.5 mm, 4 rows x 1.8 turns, rigidity K 410 N/um, \
nut outer diameter D = 39 mm, flange D1 = 62 mm, H = 10 mm flange thickness, 4 mounting holes. \
Ratings printed in kN (Ca 13.9, C0a 44.6) and converted to N. The 2-row BLK2020-3.6 is lower (Ca 7.7 kN). \
Model coding example on the page: BLK3232-3.6 ZZ +1500L C7 T H1K (accuracy symbol, see A15-12, not retrieved), so grade is an order option and is left out here. \
DN value 70,000 printed in the page header; THK's definition of DN was not on this page. Nut mass not given on this page."""

