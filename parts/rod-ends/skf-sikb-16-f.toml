# SKF maintenance-free rod end, female thread, 16 mm bore, steel/PTFE FRP sliding contact
id = "skf-sikb-16-f"
category = "rod-ends"
maker = "SKF"
country = "SE"
model = "SIKB 16 F"
notes = "Female thread M 16 (coarse), tolerance 6H; the fine-thread variant SIKB 16 F/VZ019 is M 16x1,5 with the same ratings; left-hand version SILKB 16 F. Housing width C1 is a max value. Other dims (PDF p. 204-205, printed 202-203): d2 max 43, h1 64, dk 28,5, l4 max 86, l3 min 24 (28 for /VZ019), w 22 h14, d4 max 29. CAD pins are 20 mm, so this needs a 16 mm pin. C and C0 converted from kN as printed (decimal comma) to N. Per the catalogue (PDF p. 41, printed 39), C0 for a rod end is set by the strength of the housing under a constant load along the shank axis (safety factor of at least 1,2 to housing yield), so static_radial_load_n is the rod-end housing static rating, not the bare bearing C0. Permissible shank-axis load Pperm = C0 x b2 x b6 (PDF p. 46, printed 44): b6 = 1 for constant load, 0,5 for pulsating or alternating direction (0,35 for rod ends with a relubrication facility); for alternating link load use about half of C0. Load perpendicular to the shank must not exceed 0,1 C0. SKF warns load ratings are not comparable between makers (PDF p. 40). Table PDF pages are offset by 2 from printed page numbers."

[sources]
skf = { title = "SKF spherical plain bearings and rod ends, PUB BU/P1 06116/1 EN, May 2013 (copy hosted by RS Components)", url = "https://docs.rs-online.com/8c2b/A700000014067355.pdf" }

[values]
bore_mm = { v = 16, src = "skf", page = 204 }
