# SKF maintenance-free rod end, female thread, 20 mm bore, steel/PTFE sintered bronze sliding contact
id = "skf-si-20-c"
category = "rod-ends"
maker = "SKF"
country = "SE"
model = "SI 20 C"
notes = "Female thread M 20x1,5, tolerance 6H; left-hand version SIL 20 C. Narrow E-series style bearing: only 9 deg tilt. Housing width C1 is a max value. Other dims (PDF p. 196-197, printed 194-195): d2 max 54, h1 77, dk 29, l4 max 106, l3 min 30, w 24 h14, d4 28. C and C0 converted from kN as printed (decimal comma) to N. Per the catalogue (PDF p. 41, printed 39), C0 for a rod end is set by the strength of the housing under a constant load along the shank axis (safety factor of at least 1,2 to housing yield), so static_radial_load_n is the rod-end housing static rating, not the bare bearing C0. Permissible shank-axis load Pperm = C0 x b2 x b6 (PDF p. 46, printed 44): b6 = 1 for constant load, 0,5 for pulsating or alternating direction (0,35 for rod ends with a relubrication facility); for alternating link load use about half of C0. Load perpendicular to the shank must not exceed 0,1 C0. SKF warns load ratings are not comparable between makers (PDF p. 40). Table PDF pages are offset by 2 from printed page numbers."

[sources]
skf = { title = "SKF spherical plain bearings and rod ends, PUB BU/P1 06116/1 EN, May 2013 (copy hosted by RS Components)", url = "https://docs.rs-online.com/8c2b/A700000014067355.pdf" }

