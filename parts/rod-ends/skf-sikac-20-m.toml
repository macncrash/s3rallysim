# SKF rod end requiring maintenance (relubricatable), female thread, 20 mm bore, steel/bronze sliding contact
id = "skf-sikac-20-m"
category = "rod-ends"
maker = "SKF"
country = "SE"
model = "SIKAC 20 M"
notes = "NOT maintenance-free: listed under 'Rod ends requiring maintenance', steel/bronze sliding contact, needs periodic relubrication (relubrication facility; footnote says only size 5 lacks one). Female thread M 20x1,5, tolerance 6H; left-hand version SILKAC 20 M. Housing width C1 is a max value. Other dims (PDF p. 186-187, printed 184-185): d2 max 51, h1 77, dk 34,9, l4 max 105, l3 min 30, w 30 h14, d4 max 37. Because it has a relubrication facility, b6 for alternating load is 0,35 rather than 0,5. C and C0 converted from kN as printed (decimal comma) to N. Per the catalogue (PDF p. 41, printed 39), C0 for a rod end is set by the strength of the housing under a constant load along the shank axis (safety factor of at least 1,2 to housing yield), so static_radial_load_n is the rod-end housing static rating, not the bare bearing C0. Permissible shank-axis load Pperm = C0 x b2 x b6 (PDF p. 46, printed 44): b6 = 1 for constant load, 0,5 for pulsating or alternating direction (0,35 for rod ends with a relubrication facility); for alternating link load use about half of C0. Load perpendicular to the shank must not exceed 0,1 C0. SKF warns load ratings are not comparable between makers (PDF p. 40). Table PDF pages are offset by 2 from printed page numbers."

[sources]
skf = { title = "SKF spherical plain bearings and rod ends, PUB BU/P1 06116/1 EN, May 2013 (copy hosted by RS Components)", url = "https://docs.rs-online.com/8c2b/A700000014067355.pdf" }

